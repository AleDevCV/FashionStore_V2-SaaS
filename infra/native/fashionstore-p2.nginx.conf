# Sitio independiente. Conserva los listeners y sitios de VecinoMarket.
server {
    listen 127.0.0.1:2468;
    server_name fashionstore.aledevcv.me;
    root /home/alecv/Parcial2_FashionStore/current/web;
    index index.html;
    client_max_body_size 15m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8002/health;
        add_header Cache-Control "no-store" always;
    }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location = /ngsw.json { add_header Cache-Control "no-cache" always; }
    location = /ngsw-worker.js { add_header Cache-Control "no-cache" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}

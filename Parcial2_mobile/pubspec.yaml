name: fashionstore_mobile
description: App móvil (Cliente) de FashionStore - Iteración 1. Consulta del catálogo y disponibilidad por sucursal (CU14) e inicio de sesión (CU01).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5
  permission_handler: ^13.0.2
  sqflite: ^2.4.5
  path: ^1.9.1
  uuid: ^4.6.0
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  speech_to_text: ^7.5.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

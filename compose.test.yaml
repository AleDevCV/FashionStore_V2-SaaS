name: fashionstore_p2_test
services:
  db:
    image: ${P2_TEST_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: fashionstore_p2_test
      POSTGRES_USER: p2_test_owner
      POSTGRES_PASSWORD: p2-test-only-password
    ports:
      - 127.0.0.1:55432:5432
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U p2_test_owner -d fashionstore_p2_test]
      interval: 2s
      timeout: 2s
      retries: 30
